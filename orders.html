<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">Shop<span>Hub</span></a>
    <div class="search-bar">
      <input type="text" placeholder="Search for products...">
      <button onclick="window.location.href='index.html'">Search</button>
    </div>
    <div class="nav-links" id="nav-links">
      <a href="home.html">Home</a>
      <a href="index.html">Products</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="cart.html" class="cart-link">Cart (<span id="cart-count-nav">0</span>)</a>
    </div>
  </nav>

  <div class="container">
    <div id="message"></div>
    <h1 class="page-title">My Orders</h1>

    <div id="orders-content">
      <div class="loading loading-dots">Loading orders</div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 ShopHub. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    async function loadOrders() {
      const user = getCurrentUser();
      const container = document.getElementById('orders-content');

      if (!user) {
        container.innerHTML = '<div class="empty-state"><h2>Please login to view your orders</h2><p><a href="login.html?redirect=orders.html" style="color:#2874f0;">Login here</a></p></div>';
        return;
      }

      try {
        const orders = await getOrders(user.id);
        if (orders.length === 0) {
          container.innerHTML = '<div class="empty-state"><h2>No orders yet</h2><p><a href="index.html" style="color:#2874f0;">Start shopping</a></p></div>';
          return;
        }

        let html = '';
        orders.forEach((order, i) => {
          const date = new Date(order.date);
          const status = order.status || 'confirmed';
          const isCancelled = status === 'cancelled';
          const statusLabels = { confirmed: 'Confirmed', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
          const statusColors = { confirmed: '#2874f0', shipped: '#fb641b', delivered: '#388e3c', cancelled: '#c62828' };
          html += `
            <div class="order-card reveal ${isCancelled ? 'cancelled' : ''}" style="transition-delay:${i * 0.08}s" id="order-${order.id}">
              <div class="order-header">
                <span class="order-id">Order #${order.id}</span>
                <span class="order-date">${date.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <div class="order-status" style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.8rem;">
                <span class="status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${statusColors[status]};${isCancelled ? '' : 'animation:pulse-dot 1.5s ease-in-out infinite;'}"></span>
                <span style="font-size:0.85rem;font-weight:600;color:${statusColors[status]};">${statusLabels[status] || 'Confirmed'}</span>
                ${status === 'confirmed' ? '<span class="cancel-hint" style="font-size:0.75rem;color:#999;margin-left:auto;">You can cancel this order</span>' : ''}
              </div>
              <div class="order-items">
                ${order.items.map(i => `<div>${i.productName} × ${i.quantity} — ${formatPrice(i.price * i.quantity)}</div>`).join('')}
              </div>
              <div class="order-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:0.8rem;border-top:1px solid #f1f3f6;">
                <div class="order-total" style="margin-top:0;">Total: ${formatPrice(order.total)}</div>
                ${!isCancelled ? `<button class="btn-cancel" onclick="handleCancelOrder(${order.id})">Cancel Order</button>` : '<span style="font-size:0.8rem;color:#999;">· Order cancelled</span>'}
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
        observeReveal('.order-card');
      } catch {
        container.innerHTML = '<div class="empty-state"><h2>Error loading orders</h2></div>';
      }
    }

    async function handleCancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order? This action cannot be undone.')) return;
      try {
        await cancelOrder(orderId);
        showMessage('Order #' + orderId + ' cancelled successfully', 'success');
        const card = document.getElementById('order-' + orderId);
        if (card) {
          card.classList.add('cancelled');
          card.style.transform = 'scale(0.95)';
          card.style.opacity = '0.6';
          setTimeout(() => loadOrders(), 800);
        }
        updateCartCount();
      } catch {
        showMessage('Failed to cancel order', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      loadOrders();
    });
  </script>
</body>
</html>
