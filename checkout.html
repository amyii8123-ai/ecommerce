<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">Shop<span>Hub</span></a>
    <div class="search-bar">
      <input type="text" placeholder="Search for products...">
      <button onclick="window.location.href='index.html'">Search</button>
    </div>
    <div class="nav-links" id="nav-links">
      
      <a href="home.html">Home</a>
      <a href="index.html">Products</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="cart.html" class="cart-link">Cart (<span id="cart-count-nav">0</span>)</a>
    </div>
  </nav>

  <div class="container">
    <div id="message"></div>
    <h1 class="page-title">Checkout</h1>

    <div id="checkout-content">
      <div class="loading loading-dots">Loading checkout</div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 ShopHub. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    async function loadCheckout() {
      const user = getCurrentUser();
      const container = document.getElementById('checkout-content');

      if (!user) {
        container.innerHTML = '<div class="empty-state"><h2>Please login to checkout</h2><p><a href="login.html?redirect=checkout.html" style="color:#2874f0;">Login here</a></p></div>';
        return;
      }

      try {
        const items = await apiGet(`/cart?userId=${user.id}&_expand=product`);
        if (items.length === 0) {
          container.innerHTML = '<div class="empty-state"><h2>Your cart is empty</h2><p><a href="index.html" style="color:#2874f0;">Continue shopping</a></p></div>';
          return;
        }

        let total = 0;
        let summaryHtml = '';
        items.forEach(item => {
          const price = item.product ? item.product.price : 0;
          const itemTotal = price * item.quantity;
          total += itemTotal;
          summaryHtml += `
            <div class="summary-item">
              <span>${item.product ? item.product.name : 'Unknown'} × ${item.quantity}</span>
              <span>${formatPrice(itemTotal)}</span>
            </div>
          `;
        });

        container.innerHTML = `
          <div class="checkout-layout">
            <div class="checkout-form reveal">
              <h2>Shipping Address</h2>
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="addr-name" value="${user.name}" required>
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="addr-phone" placeholder="10-digit mobile number" required>
              </div>
              <div class="form-group">
                <label>Address</label>
                <textarea id="addr-line" placeholder="House / Flat / Street" required></textarea>
              </div>
              <div class="form-group">
                <label>City</label>
                <input type="text" id="addr-city" placeholder="City" required>
              </div>
              <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="addr-pincode" placeholder="6-digit pincode" required>
              </div>
              <button class="btn-primary" onclick="placeOrder()">Place Order</button>
            </div>
            <div class="order-summary reveal" style="transition-delay:0.1s">
              <h2>Order Summary</h2>
              ${summaryHtml}
              <div class="summary-total">
                <span>Total</span>
                <span>${formatPrice(total)}</span>
              </div>
            </div>
          </div>
        `;
      } catch {
        container.innerHTML = '<div class="empty-state"><h2>Error loading checkout</h2><p>Make sure json-server is running.</p></div>';
      }
      observeReveal('.checkout-form, .order-summary');
    }

    async function placeOrder() {
      const user = getCurrentUser();
      const name = document.getElementById('addr-name').value.trim();
      const phone = document.getElementById('addr-phone').value.trim();
      const address = document.getElementById('addr-line').value.trim();
      const city = document.getElementById('addr-city').value.trim();
      const pincode = document.getElementById('addr-pincode').value.trim();

      if (!name || !phone || !address || !city || !pincode) {
        showMessage('Please fill all fields', 'error');
        return;
      }
      if (phone.length < 10) { showMessage('Enter a valid phone number', 'error'); return; }
      if (pincode.length < 6) { showMessage('Enter a valid pincode', 'error'); return; }

      try {
        const items = await apiGet(`/cart?userId=${user.id}&_expand=product`);
        const orderItems = items.map(i => ({
          productId: i.productId,
          productName: i.product.name,
          price: i.product.price,
          quantity: i.quantity
        }));
        const total = orderItems.reduce((s, i) => s + i.price * i.quantity, 0);

        await createOrder({
          userId: user.id,
          items: orderItems,
          total,
          shipping: { name, phone, address, city, pincode },
          date: new Date().toISOString(),
          status: 'confirmed'
        });

        await clearCart(user.id);
        showMessage('Order placed successfully!', 'success');
        updateCartCount();
        fireConfetti();
        setTimeout(() => { window.location.href = 'orders.html'; }, 2000);
      } catch {
        showMessage('Failed to place order', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      loadCheckout();
    });
  </script>
</body>
</html>
