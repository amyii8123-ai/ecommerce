<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">Shop<span>Hub</span></a>
    <div class="search-bar">
      <input type="text" placeholder="Search for products...">
      <button onclick="window.location.href='index.html'">Search</button>
    </div>
    <div class="nav-links" id="nav-links">
      <a href="home.html">Home</a>
      <a href="index.html">Products</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="cart.html" class="cart-link">Cart (<span id="cart-count-nav">0</span>)</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-form fade-in">
      <h2>Login</h2>
      <div id="message"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <button class="btn-primary" onclick="handleLogin()">Login</button>
      <p>Don't have an account? <a href="register.html">Register</a></p>
      <p style="margin-top:0.5rem;font-size:0.8rem;color:#999;">Demo: admin@shop.com / admin123</p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 ShopHub. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) { showMessage('Please fill all fields', 'error'); return; }
      try {
        await loginUser(email, password);
        showMessage('Login successful!', 'success');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'index.html';
        setTimeout(() => { window.location.href = redirect; }, 1000);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', updateNavbar);
  </script>
</body>
</html>
